<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tour Virtual | Alvi Private</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"><style>html,body,#v{height:100%;margin:0;background:#111;font-family:Arial,sans-serif}#v{position:fixed;inset:0}.brand{position:fixed;z-index:5;top:22px;left:22px;color:white;text-shadow:0 2px 12px #000}.brand b{letter-spacing:.18em}.brand small{display:block;color:#e2c47f;letter-spacing:.12em;margin-top:4px}.scene{position:fixed;z-index:5;left:24px;bottom:28px;color:#fff;text-shadow:0 2px 12px #000}.scene small{color:#e2c47f;letter-spacing:.18em}.scene h1{margin:5px 0 0;font-size:34px}.nav{position:fixed;z-index:6;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:10px;align-items:center}.nav button{width:54px;height:50px;border:1px solid #555;background:rgba(0,0,0,.72);color:#fff;border-radius:14px;font-size:22px}.box{min-width:200px;padding:10px 16px;border:1px solid #555;background:rgba(0,0,0,.72);color:#fff;border-radius:14px}.box small{color:#e2c47f}.box b{display:block;margin-top:2px}@media(max-width:700px){.scene{bottom:90px}.scene h1{font-size:24px}.box{min-width:150px}}</style></head><body><div id="v"></div><div class="brand"><b id="b"></b><small id="s"></small></div><div class="scene"><small>VOCÊ ESTÁ EM</small><h1 id="name"></h1></div><div class="nav"><button id="p">←</button><div class="box"><small id="count"></small><b id="n2"></b></div><button id="n">→</button></div><script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script><script>const scenes=[{"name":"Garagem","file":"assets/ambiente-01.jpg"},{"name":"Recepção","file":"assets/ambiente-02.jpg"},{"name":"sala Atendimento","file":"assets/ambiente-03.jpg"}];let i=0,v;document.title="Tour Virtual | Alvi Private";document.getElementById('b').textContent="ALVI PRIVATE";document.getElementById('s').textContent="TOUR VIRTUAL 360°";function show(x){i=(x+scenes.length)%scenes.length;if(v)v.destroy();v=pannellum.viewer('v',{type:'equirectangular',panorama:scenes[i].file,autoLoad:true,showControls:true,hfov:100,minHfov:50,maxHfov:120});document.getElementById('name').textContent=scenes[i].name;document.getElementById('n2').textContent=scenes[i].name;document.getElementById('count').textContent=(i+1)+' / '+scenes.length}document.getElementById('p').onclick=()=>show(i-1);document.getElementById('n').onclick=()=>show(i+1);show(0);</script></body></html>
